<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>wizard-harness · 观测台</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #16161e; }
      html { overflow: hidden; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable",
          "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #e6e6ef;
        border-radius: 12px;
        overflow: hidden;
      }
      #root { border-radius: 12px; overflow: hidden; }
      /* 全局滚动条（统一美化，所有观测窗口一致） */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,.14);
        border-radius: 5px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.24); background-clip: padding-box; }
      ::-webkit-scrollbar-corner { background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./renderer.bundle.js"></script>
  </body>
</html>
