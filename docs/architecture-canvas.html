<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>wizard-harness · 架构大画布</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #101018; color: #e6e6ef;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable",
      "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  #viewport { position: fixed; inset: 0; overflow: hidden; cursor: grab; }
  #viewport.panning { cursor: grabbing; }
  #canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0;
    width: 3000px; height: 2100px;
    background-color: #14141e;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(rgba(255,255,255,.016) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.016) 1px, transparent 1px);
    background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px; }
  #lines { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  .group { position: absolute; border: 1px dashed rgba(255,255,255,.10); border-radius: 18px;
    background: rgba(255,255,255,.018); pointer-events: none; }
  .group .gt { position: absolute; top: 10px; left: 16px; font-size: 12px; letter-spacing: .12em;
    color: rgba(255,255,255,.42); text-transform: uppercase; }
  .group .gsub { position: absolute; top: 28px; left: 16px; font-size: 11px; color: rgba(255,255,255,.22); }
  .node { position: absolute; background: #1b1b28; border: 1px solid #2c2c3e; border-radius: 12px;
    padding: 12px 14px; cursor: grab; user-select: none; box-shadow: 0 4px 14px rgba(0,0,0,.35);
    overflow: hidden;
    transition: border-color .12s, box-shadow .12s; }
  .node:hover { border-color: #4a6aa0; box-shadow: 0 6px 18px rgba(74,106,160,.28); }
  .node.dragging { cursor: grabbing; border-color: #79c0ff; box-shadow: 0 8px 24px rgba(121,192,255,.35); }
  .node .t { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .node .t .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .node .s { margin-top: 5px; font-size: 11.5px; color: #a8a8bd; line-height: 1.5; }
  .node .b { margin-top: 7px; font-size: 10.5px; color: #7ee787; font-family: ui-monospace, Consolas, monospace; }
  .node .b span { display: inline-block; margin-right: 6px; padding: 1px 7px; border-radius: 10px;
    border: 1px solid rgba(126,231,135,.25); background: rgba(126,231,135,.07); }
  .node.warn { border-color: #9e6a03; }
  .node.warn .b { color: #e3b341; }
  .node.warn .b span { border-color: rgba(227,179,65,.35); background: rgba(227,179,65,.08); }
  /* top bar */
  #bar { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 50;
    display: flex; align-items: center; gap: 8px; background: rgba(22,22,32,.92);
    border: 1px solid #2c2c3e; border-radius: 12px; padding: 8px 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45); backdrop-filter: blur(8px); }
  #bar .title { font-size: 13px; font-weight: 600; margin-right: 6px; }
  #bar .title small { color: #7ee787; font-weight: 400; margin-left: 6px; }
  #bar button { background: #26263a; color: #e6e6ef; border: 1px solid #33334a; border-radius: 8px;
    font-size: 12px; padding: 4px 10px; cursor: pointer; }
  #bar button:hover { background: #2f2f48; }
  #bar .zoom { font-size: 12px; color: #a8a8bd; min-width: 46px; text-align: center;
    font-variant-numeric: tabular-nums; }
  #search { width: 190px; background: #26263a; color: #e6e6ef; border: 1px solid #33334a;
    border-radius: 8px; padding: 5px 10px; font-size: 12px; outline: none; }
  #search::placeholder { color: #6a6a82; }
  #search:focus { border-color: #4a6aa0; }
  #results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 60;
    background: #1b1b28; border: 1px solid #33334a; border-radius: 10px; overflow: hidden;
    box-shadow: 0 12px 32px rgba(0,0,0,.5); display: none; max-height: 300px; overflow-y: auto; }
  #results.open { display: block; }
  #results .item { padding: 7px 12px; font-size: 12px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  #results .item:hover, #results .item.sel { background: #26263a; }
  #results .item .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  #results .item .id { margin-left: auto; color: #7ee787; font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; }
  #results .empty { padding: 8px 12px; font-size: 11.5px; color: #a8a8bd; }
  .node.hl { animation: hl 1.6s ease; }
  @keyframes hl {
    0%, 55% { border-color: #ffd866; box-shadow: 0 0 0 3px rgba(255,216,102,.45), 0 8px 24px rgba(255,216,102,.25); }
    100% { border-color: #2c2c3e; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  }
  /* legend */
  #legend { position: fixed; left: 14px; bottom: 14px; z-index: 50; background: rgba(22,22,32,.92);
    border: 1px solid #2c2c3e; border-radius: 12px; padding: 10px 12px; font-size: 11px;
    color: #a8a8bd; box-shadow: 0 8px 24px rgba(0,0,0,.45); backdrop-filter: blur(8px); }
  #legend .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  #legend svg { display: block; }
  #legend .swatch { display: inline-block; }
  #hint { position: fixed; right: 14px; bottom: 14px; z-index: 50; font-size: 11px; color: rgba(255,255,255,.30); }
  /* modal */
  #modal { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
    background: rgba(8,8,14,.62); backdrop-filter: blur(3px); }
  #modal.open { display: flex; }
  #modal .card { width: 460px; max-width: 92vw; background: #1b1b28; border: 1px solid #33334a;
    border-radius: 14px; padding: 20px 22px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  #modal .mhead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  #modal .mhead .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #modal .mhead h2 { font-size: 16px; font-weight: 600; flex: 1; }
  #modal .mhead .x { background: none; border: none; color: #a8a8bd; font-size: 18px; cursor: pointer; }
  #modal .mdesc { font-size: 13px; line-height: 1.75; color: #cfcfe0; }
  #modal .mmeta { margin-top: 14px; font-size: 11px; color: #7ee787;
    font-family: ui-monospace, Consolas, monospace; }
  #modal .mmeta span { display: inline-block; margin: 0 6px 6px 0; padding: 2px 9px; border-radius: 10px;
    border: 1px solid rgba(126,231,135,.25); background: rgba(126,231,135,.07); }
  #modal .mlinks { margin-top: 10px; font-size: 11px; color: #79c0ff; line-height: 1.8; }
</style>
</head>
<body>
<div id="viewport"><div id="canvas"></div></div>

<div id="bar">
  <span class="title">wizard-harness 架构大画布<small>大画布可缩放 · 拖拽 · 点节点看详情</small></span>
  <input id="search" placeholder="搜索组件…（如 registrar / 事件）" autocomplete="off" spellcheck="false" />
  <div id="results"></div>
  <button id="btn-fit" title="缩放到全部内容">全览</button>
  <button id="btn-out">−</button>
  <span class="zoom" id="zoomv">100%</span>
  <button id="btn-in">＋</button>
  <button id="btn-reset" title="恢复默认布局">重置布局</button>
</div>

<div id="legend">

  <div class="row"><span class="swatch"><svg width="34" height="10"><line x1="0" y1="5" x2="34" y2="5" stroke="#79c0ff" stroke-width="2" marker-end="url(#arrow-blue)"/></svg></span>装配链路（运行时壳 → core → 插件）</div>
  <div class="row"><span class="swatch"><svg width="34" height="10"><line x1="0" y1="5" x2="34" y2="5" stroke="#7ee787" stroke-width="2" marker-end="url(#arrow-green)"/></svg></span>事件 / 数据流（观测链路）</div>
  <div class="row"><span class="swatch"><svg width="34" height="10"><line x1="0" y1="5" x2="34" y2="5" stroke="#e3b341" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-orange)"/></svg></span>服务依赖（inject / provides）</div>
  <div class="row"><span class="swatch"><svg width="34" height="10"><line x1="0" y1="5" x2="34" y2="5" stroke="#d2a8ff" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-purple)"/></svg></span>依赖 core 契约（core 不依赖插件）</div>
  <div class="row" style="color:#e3b341;">⚠ 黄色节点 = 已知遗留 / 待触发项</div>
</div>
<div id="hint">滚轮缩放 · 空白拖拽平移 · 节点可拖动 · 单击节点看详情</div>

<div id="modal" onclick="if(event.target===this)closeModal()">
  <div class="card">
    <div class="mhead"><span class="dot" id="m-dot"></span><h2 id="m-title"></h2>
      <button class="x" onclick="closeModal()">✕</button></div>
    <div class="mdesc" id="m-desc"></div>
    <div class="mmeta" id="m-meta"></div>
    <div class="mlinks" id="m-links"></div>
  </div>
</div>

/* ============================= 渲染 ============================= */
const canvas = document.getElementById('canvas');
const ns = 'http://www.w3.org/2000/svg';

const svg = document.createElementNS(ns, 'svg');

const defs = document.createElementNS(ns, 'defs');
for (const [name, color] of [['arrow-blue', '#79c0ff'], ['arrow-green', '#7ee787'], ['arrow-cyan', '#56d4dd'], ['arrow-orange', '#e3b341'], ['arrow-purple', '#d2a8ff']]) {
  const mk = document.createElementNS(ns, 'marker');
  mk.setAttribute('id', name);
  mk.setAttribute('markerWidth', '8'); mk.setAttribute('markerHeight', '8');
  mk.setAttribute('refX', '7'); mk.setAttribute('refY', '4');
  mk.setAttribute('orient', 'auto');
  const p = document.createElementNS(ns, 'path');
  p.setAttribute('d', 'M0,0 L8,4 L0,8 z');
  p.setAttribute('fill', color);
  mk.appendChild(p);
  defs.appendChild(mk);
}
svg.appendChild(defs);

const nodeEls = new Map();
function renderGroups() {
  for (const g of GROUP_DEFS) {
    const el = document.createElement('div');
    el.className = 'group';
    el.style.left = g.x + 'px'; el.style.top = g.y + 'px';
    el.style.width = g.w + 'px'; el.style.height = g.h + 'px';
    el.innerHTML = '<div class="gt">' + g.t + '</div><div class="gsub">' + g.s + '</div>';
    canvas.appendChild(el);
  }
}
function renderNodes() {
  for (const n of NODES) {
    const el = document.createElement('div');
    el.className = 'node' + (n.warn ? ' warn' : '');
    el.dataset.id = n.id;
    el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
    el.style.width = n.w + 'px';
    /* 高度不预设：由内容自适应撑开，避免文字被截断 */
    let html = '<div class="t"><span class="dot" style="background:' + n.color + '"></span>' + n.title + '</div>';
    html += '<div class="s">' + n.sub + '</div>';
    if (n.badge) html += '<div class="b">' + n.badge.map((b) => '<span>' + b + '</span>').join('') + '</div>';
    el.innerHTML = html;
    canvas.appendChild(el);
    nodeEls.set(n.id, el);
    /* 回写实际渲染高度，供 fit / 连线 / 校验使用 */
    n.h = el.offsetHeight;
  }
}

function edgePoint(n, tx, ty, tw, th) {
  const sx = n.x + n.w / 2, sy = n.y + n.h / 2;
  const cxp = tx + tw / 2, cyp = ty + th / 2;
  const dx = cxp - sx, dy = cyp - sy;
  if (dx === 0 && dy === 0) return [cxp, cyp];
  const sx2 = dx !== 0 ? (tw / 2) / Math.abs(dx) : Infinity;
  const sy2 = dy !== 0 ? (th / 2) / Math.abs(dy) : Infinity;
  const s = Math.min(sx2, sy2);
  return [cxp - dx * s, cyp - dy * s];
}

let pathGroup;
function drawLinks() {
  if (pathGroup) pathGroup.remove();
  pathGroup = document.createElementNS(ns, 'g');
  for (const l of LINKS) {
    const a = nodeEls.get(l.from), b = nodeEls.get(l.to);
    if (!a || !b) continue;
    const k = KIND[l.kind];
    const sx = a.offsetLeft + a.offsetWidth / 2;
    const sy = a.offsetTop + a.offsetHeight / 2;
    const [ex, ey] = edgePoint({ x: a.offsetLeft, y: a.offsetTop, w: a.offsetWidth, h: a.offsetHeight },
      b.offsetLeft, b.offsetTop, b.offsetWidth, b.offsetHeight);
    const p = document.createElementNS(ns, 'path');
    const midx = (sx + ex) / 2, midy = (sy + ey) / 2 - 18;
    p.setAttribute('d', 'M' + sx + ',' + sy + ' Q' + midx + ',' + midy + ' ' + ex + ',' + ey);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', k.stroke);
    p.setAttribute('stroke-width', '2');
    if (k.dash) p.setAttribute('stroke-dasharray', k.dash);
    p.setAttribute('marker-end', 'url(#arrow-' + l.kind + ')');
    pathGroup.appendChild(p);
    if (l.label) {
      const t = document.createElementNS(ns, 'text');
      const lx = (sx + ex) / 2, ly = (sy + ey) / 2 - 22;
      t.setAttribute('x', lx); t.setAttribute('y', ly);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('fill', k.stroke);
      t.setAttribute('font-size', '10.5');
      t.setAttribute('font-family', 'ui-monospace, Consolas, monospace');
      t.textContent = l.label;
      pathGroup.appendChild(t);
    }
  }
  svg.appendChild(pathGroup);
}

/* ============================= 视图 / 交互 ============================= */
const view = { x: 0, y: 0, k: 1 };
const DEFAULTS = NODES.map((n) => ({ x: n.x, y: n.y }));

function apply() {
  canvas.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.k + ')';
  document.getElementById('zoomv').textContent = Math.round(view.k * 100) + '%';
}
function resetLayout() {
  NODES.forEach((n, i) => { n.x = DEFAULTS[i].x; n.y = DEFAULTS[i].y; });
  nodeEls.forEach((el, id) => {
    const n = NODES.find((x) => x.id === id);
    el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
  });
  drawLinks();
}
function fit() {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of NODES) {
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + n.w); maxY = Math.max(maxY, n.y + n.h);
  }
  const vw = window.innerWidth, vh = window.innerHeight;
  const k = Math.min((vw - 80) / (maxX - minX), (vh - 80) / (maxY - minY), 1.2);
  view.k = k;
  view.x = (vw - (maxX - minX) * k) / 2 - minX * k;
  view.y = (vh - (maxY - minY) * k) / 2 - minY * k;
  apply();
}

const vp = document.getElementById('viewport');
let drag = null;

/* 屏蔽右键菜单（画布内右键不再弹出浏览器菜单） */
vp.addEventListener('contextmenu', (e) => e.preventDefault());

vp.addEventListener('pointerdown', (e) => {
  const nodeEl = e.target.closest('.node');
  if (nodeEl) {
    const n = NODES.find((x) => x.id === nodeEl.dataset.id);
    drag = { type: 'node', n, startX: e.clientX, startY: e.clientY, ox: n.x, oy: n.y, moved: false };
    nodeEl.classList.add('dragging');
  } else {
    drag = { type: 'pan', startX: e.clientX, startY: e.clientY, ox: view.x, oy: view.y };
    vp.classList.add('panning');
  }
  vp.setPointerCapture(e.pointerId);
});
vp.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
  if (drag.type === 'pan') {
    view.x = drag.ox + dx; view.y = drag.oy + dy;
    apply();
  } else {
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    const n = drag.n;
    n.x = drag.ox + dx / view.k; n.y = drag.oy + dy / view.k;
    const el = nodeEls.get(n.id);
    el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
    drawLinks();
  }
});
function endDrag(e) {
  if (drag && drag.type === 'node') {
    const el = nodeEls.get(drag.n.id);
    el.classList.remove('dragging');
    if (!drag.moved) openModal(drag.n);
  }
  drag = null;
  vp.classList.remove('panning');
}
vp.addEventListener('pointerup', endDrag);
vp.addEventListener('pointercancel', endDrag);

vp.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = vp.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const k2 = Math.min(3, Math.max(0.1, view.k * Math.exp(-e.deltaY * 0.0012)));
  const wx = (mx - view.x) / view.k, wy = (my - view.y) / view.k;
  view.x = mx - wx * k2; view.y = my - wy * k2; view.k = k2;
  apply();
}, { passive: false });

function zoomBy(f) {
  const rect = vp.getBoundingClientRect();
  const mx = rect.width / 2, my = rect.height / 2;
  const k2 = Math.min(3, Math.max(0.1, view.k * f));
  const wx = (mx - view.x) / view.k, wy = (my - view.y) / view.k;
  view.x = mx - wx * k2; view.y = my - wy * k2; view.k = k2;
  apply();
}
document.getElementById('btn-in').onclick = () => zoomBy(1.25);
document.getElementById('btn-out').onclick = () => zoomBy(0.8);
document.getElementById('btn-fit').onclick = fit;
document.getElementById('btn-reset').onclick = resetLayout;

/* ============================= 搜索 / 定位 ============================= */
const searchInput = document.getElementById('search');
const resultsBox = document.getElementById('results');
let resultIdx = -1;

function searchItems(q) {
  const t = q.trim().toLowerCase();
  if (!t) return [];
  return NODES.filter((n) =>
    (n.id + ' ' + n.title + ' ' + n.sub + ' ' + (n.badge || []).join(' ')).toLowerCase().includes(t),
  );
}
function renderResults(items) {
  resultsBox.innerHTML = '';
  if (!items.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = '无匹配组件';
    resultsBox.appendChild(e);
    resultsBox.classList.add('open');
    return;
  }
  items.slice(0, 8).forEach((n, i) => {
    const d = document.createElement('div');
    d.className = 'item' + (i === resultIdx ? ' sel' : '');
    d.innerHTML = '<span class="dot" style="background:' + n.color + '"></span>' + n.title +
      ' <span class="id">' + n.id + '</span>';
    d.onclick = () => focusNode(n.id);
    d.onmousemove = () => { resultIdx = i; syncSel(); };
    resultsBox.appendChild(d);
  });
  resultsBox.classList.add('open');
}
function syncSel() {
  [...resultsBox.children].forEach((c, i) => c.classList.toggle('sel', i === resultIdx));
}
function focusNode(id) {
  const n = NODES.find((x) => x.id === id);
  if (!n) return;
  const rect = vp.getBoundingClientRect();
  const k2 = Math.max(view.k, 1.0);
  const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
  view.k = k2;
  view.x = rect.width / 2 - cx * k2;
  view.y = rect.height / 2 - cy * k2;
  apply();
  const el = nodeEls.get(id);
  if (el) {
    el.classList.remove('hl');
    void el.offsetWidth; /* 强制重排，保证连续定位动画可重放 */
    el.classList.add('hl');
  }
  resultsBox.classList.remove('open');
}
searchInput.addEventListener('input', () => { resultIdx = -1; renderResults(searchItems(searchInput.value)); });
searchInput.addEventListener('keydown', (e) => {
  const items = searchItems(searchInput.value);
  const shown = Math.min(items.length, 8);
  if (e.key === 'ArrowDown') { e.preventDefault(); resultIdx = Math.min(resultIdx + 1, shown - 1); syncSel(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); resultIdx = Math.max(resultIdx - 1, 0); syncSel(); }
  else if (e.key === 'Enter') { const n = items[resultIdx >= 0 ? resultIdx : 0]; if (n) focusNode(n.id); }
  else if (e.key === 'Escape') { searchInput.value = ''; resultsBox.classList.remove('open'); }
});
document.addEventListener('click', (e) => { if (!e.target.closest('#bar')) resultsBox.classList.remove('open'); });

/* ============================= 详情 ============================= */
const modal = document.getElementById('modal');
function openModal(n) {
  document.getElementById('m-dot').style.background = n.color;
  document.getElementById('m-title').textContent = n.title;
  document.getElementById('m-desc').textContent = n.sub;
  const meta = document.getElementById('m-meta');
  meta.innerHTML = '';
  if (n.badge) for (const b of n.badge) {
    const s = document.createElement('span'); s.textContent = b; meta.appendChild(s);
  }
  const links = document.getElementById('m-links');
  links.innerHTML = '';
  const rel = LINKS.filter((l) => l.from === n.id || l.to === n.id);
  if (rel.length) {
    links.textContent = '关联：' + rel.map((l) => l.from + ' → ' + l.to + (l.label ? '（' + l.label + '）' : '')).join('；');
  }
  modal.classList.add('open');
}
function closeModal() { modal.classList.remove('open'); }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

/* ============================= 启动 ============================= */
renderGroups();
renderNodes();
drawLinks();
fit();
</script>
</body>
</html>
