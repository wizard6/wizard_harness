<body>
  <h1>code-editor — 代码浏览与编辑</h1>
  <p>读写工作区文本文件；编辑区带语法高亮（关键词/字符串/注释/数字等分色）。浏览请用 <code>code-browser</code>。</p>
  <p>服务 <code>codeEditor</code>：<code>info</code> · <code>read</code> · <code>write</code> · <code>queueOpen</code> · <code>takePendingOpen</code>。</p>
