  <title>code-browser 插件 · wizard-harness</title>
  <style>
    body { font: 15px/1.6 system-ui, sans-serif; background: #101018; color: #e6e6ef; max-width: 820px; margin: 28px auto; padding: 0 20px; }
    code { color: #7ee787; font-family: ui-monospace, Consolas, monospace; }

<body>
  <h1>code-browser — 代码浏览器（独立窗口）</h1>
  <p>只读浏览工作区源码，独立 Electron 弹窗；按扩展名语法高亮（TS/JS/JSON/CSS/HTML）。</p>
  <p>需要编辑时点工具栏 <b>编辑</b>，会另开 <code>code-editor</code> 窗口。</p>
  <p>服务 <code>codeBrowser</code>：<code>info</code> · <code>read</code> · <code>queueOpen</code> · <code>takePendingOpen</code>。</p>
</body>
